# Credential Preference Scenario Configuration
# Scenario: Teach the agent that credential-based access is cheaper and more reliable than blind exploitation
# Network size: Small (100 hosts)
# Host/service types: 70 User hosts, 20 Application servers, 10 Infrastructure nodes
# Vulnerability distribution: 30% of user hosts share weak credentials
# Reward: Immediate: +2 for authenticated access, -1 for failed exploit
# Termination: First authenticated foothold OR step limit
# Expected behavior: Prefer credential reuse over exploit attempts. Stop scanning once access is achieved

environment: Cyberwheel
experiment_name: CredentialPreferenceScenario
red_agent: rl_red_agent_credential_preference.yaml
blue_agent: inactive_blue_agent.yaml
network_config: credential-preference-100host-network.yaml
decoy_config: decoy_hosts.yaml
host_config: host_defs_services.yaml
num_steps: 50
num_episodes: 10
deterministic: false
red_reward_function: reward_credential_preference
valid_targets: all
network_size_compatibility: small

